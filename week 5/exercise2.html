<!DOCTYPE html>
<html lang="en">
<head>
    <title>Exercise 2</title>
</head>
<body>
    <h1>Example on unordered list</h1>
    <ul>
        <li>sportstar</li>
        <li>Business week</li>
        <li>Time</li>
    </ul>
    <h2>Example on ordered list</h2>
    <ol type="i" start="4">
        <li>sportstart</li>
        <li>Business week</li>
        <li>time</li>
    </ol>
    <h3>Example on definition list</h3>
    <dl>
        <dt>Sports Magazine</dt>
        <dd>Sportstart</dd>
        <dt>Business Magazine</dt>
        <dd>Business week</dd>
    </dl>
</body>
</html>
