<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task 1 - Table Reproduction</title>
    <link rel="stylesheet" href="task1.css">
</head>
<body>

    <div class="table-container">
        <div class="col-header header1">Column 1</div>
        <div class="col-header header2">Column 2</div>
        <div class="col-header header3">Column 3</div>

        <div class="box blue-sidebar">
            <p>A numbered list:</p>
            <ol>
                <li>Able</li>
                <li>Baker</li>
                <li>Charlie</li>
                <li>Delta</li>
                <li>Echo</li>
            </ol>
        </div>

        <div class="box yellow-box">B</div>

        <div class="box red-box">C</div>

        <div class="box green-box">
            <p>An unnumbered list:</p>
            <ul>
                <li>Pounds</li>
                <li>Dollars</li>
                <li>Euro</li>
                <li>Yen</li>
                <li>Roubles</li>
            </ul>
        </div>
    </div>

</body>
</html>
